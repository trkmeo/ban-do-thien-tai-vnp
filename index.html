<script>
// Hàm để làm exclusive checkboxes trong LayerControl
function setupExclusiveLayers() {
    var control = document.querySelector('.leaflet-control-layers');
    if (!control) return false;

    var checkboxes = control.querySelectorAll('input[type="checkbox"]');
    if (checkboxes.length === 0) return false;

    // Map checkbox to layer (Leaflet stores in _layer)
    var layerMap = {};
    checkboxes.forEach(function(cb) {
        if (cb._layer) {
            layerMap[cb.value || cb.name] = cb._layer;  // Use value or name as key if needed
            cb._layerId = cb._layer._leaflet_id;  // Store ID for easy access
        }
    });

    // Remove old listeners
    checkboxes.forEach(function(cb) {
        cb.removeEventListener('change', cb._exclusiveChange);
    });

    // Handler cho exclusive (manual: remove all others, add selected)
    function exclusiveChange(e) {
        var targetCb = e.target;
        var targetLayer = targetCb._layer;

        if (targetCb.checked) {
            // Remove ALL layers first (except base map)
            Object.keys(layerMap).forEach(function(key) {
                var lyr = layerMap[key];
                if (map.hasLayer(lyr)) {
                    map.removeLayer(lyr);
                }
            });

            // Uncheck all others
            checkboxes.forEach(function(cb) {
                if (cb !== targetCb) {
                    cb.checked = false;
                }
            });

            // Add the selected layer
            if (targetLayer && !map.hasLayer(targetLayer)) {
                map.addLayer(targetLayer);
            }
            targetCb.checked = true;  // Ensure checked

        } else {
            // Prevent uncheck: fallback to 'All'
            var allCb = Array.from(checkboxes).find(cb => cb.nextSibling && cb.nextSibling.textContent.trim().includes('All'));
            if (allCb) {
                // Trigger All
                allCb.checked = true;
                var allLayer = allCb._layer;
                if (allLayer && !map.hasLayer(allLayer)) {
                    map.addLayer(allLayer);
                }
                // Remove target if it was added
                if (targetLayer && map.hasLayer(targetLayer)) {
                    map.removeLayer(targetLayer);
                }
                targetCb.checked = false;
            }
        }
    }

    // Attach listener
    checkboxes.forEach(function(cb) {
        cb.addEventListener('change', exclusiveChange);
        cb._exclusiveChange = exclusiveChange;
    });

    // Init: remove all layers, add only 'All'
    var allCb = Array.from(checkboxes).find(cb => cb.nextSibling && cb.nextSibling.textContent.trim().includes('All'));
    if (allCb) {
        allCb.checked = true;
        var allLayer = allCb._layer;
        if (allLayer) {
            // Remove others first
            checkboxes.forEach(function(cb) {
                if (cb !== allCb && cb._layer && map.hasLayer(cb._layer)) {
                    map.removeLayer(cb._layer);
                }
                if (cb !== allCb) cb.checked = false;
            });
            // Add All
            if (!map.hasLayer(allLayer)) {
                map.addLayer(allLayer);
            }
        }
    }

    return true;
}

// Polling để wait cho LayerControl render
var pollInterval = setInterval(function() {
    if (setupExclusiveLayers()) {
        clearInterval(pollInterval);
        console.log('Exclusive layer control setup complete');
    }
}, 200);

// Fallback timeout
setTimeout(function() {
    setupExclusiveLayers();
    clearInterval(pollInterval);
}, 2000);
</script>
